# the example questions the web UI offers (the "Example questions" menu
# and the start page). plain natural language, as a user would type it:
# the point of PloverAI is that nobody has to know the relation or the
# Biolink types behind a question. this list is for the UI only; the
# benchmark reads its frozen gold set from benchmark/golden_questions/,
# never from here. the first 19 repeat the gold questions' wording; the
# last was asked on the workbench on 2026-10-07 and ARAX answered it
# (run 2026-10-07T23-54-54Z_340b5a57: 5 answers, 61 facts).
examples:
  - What drugs treat type 2 diabetes mellitus?
  - What diseases are associated with CFTR?
  - What adverse events does warfarin cause?
  - What human genes/proteins does aspirin physically interact with?
  - Which genes participate in the cholesterol biosynthesis pathway?
  - Which diseases present with seizures?
  - Which genes/proteins does imatinib physically interact with?
  - Which pathways involve HMGCR?
  - What phenotypic features does cystic fibrosis cause?
  - Which pathways involve lanosterol?
  - Which enzymes metabolize codeine?
  - What diseases can asbestos exposure cause?
  - Which genes are associated with microcephaly?
  - In which tissues is ACE2 expressed?
  - Which drugs are contraindicated in Dravet syndrome?
  - Which drugs are contraindicated in myasthenia gravis?
  - Where in the body does endometriosis occur?
  - What side effects does trofinetide cause?
  - What is the molecular target of metaxalone?
  - What drugs treat glaucoma?
