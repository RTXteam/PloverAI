# single source of truth for the pipeline at runtime.
# keep this in sync with benchmark/golden_questions/evidence/
# (the gold question set, one q*.json per question). nothing in
# code reads model names, endpoint
# hosts, or counts from anywhere else — switching providers / staging
# mirrors is a one-line edit here.

# every external service the pipeline talks to. each entry is a BASE
# URL; the corresponding client appends the specific path it needs
# (e.g. the Retriever client appends /query and /meta_knowledge_graph).
# this is the single place to point the pipeline at a different host.
#
# the knowledge graph is the NCATS Biomedical Data Translator's Tier 0
# graph. ARAX reasons over it (its facts arrive through Retriever,
# aggregator infores:dogpark-tier0), and the pipeline reads the same
# graph directly from Retriever for its meta knowledge graph, its
# entity probes and the one-hop lookup condition of the benchmark.
# retriever.transltr.io did not resolve on 2026-09-29. from 2026-10-07
# the pipeline uses the ITRB CI instance: ARAX at arax.ncats.io is a
# development deployment, CI follows development most closely, and the
# dev instance (retriever.dev.transltr.io) is being moved to TRAPI 2.0
# (it did not resolve on 2026-10-07). until then runs used the test
# instance; CI and test reported the same versions that day and gave
# the same answer to one probe query.
#
# versions (checked 2026-09-29, Retriever CI 2026-10-07): ARAX 1.6.2
# speaks TRAPI 1.6 with Biolink 4.2.5; Retriever TRAPI 1.6 with Biolink 4.3.2; the RENCI
# NameRes and NodeNorm run Babel 2026jul22 with Biolink 4.4.3. Every
# run records what each service reported in run.json ->
# service_versions.
endpoints:
  arax:       "https://arax.ncats.io/api/arax/v1.4"     # client appends /query; the reasoner (multi-hop, Tier 0)
  retriever:  "https://retriever.ci.transltr.io"        # client appends /query, /meta_knowledge_graph (Tier 0)
  openrouter: "https://openrouter.ai/api/v1"            # client appends /chat/completions
  nameres:    "https://name-resolution-sri.renci.org"   # client appends /lookup
  nodenorm:   "https://nodenormalization-sri.renci.org" # client appends /get_normalized_nodes
  pubtator:   "https://www.ncbi.nlm.nih.gov/research/pubtator3-api"  # client appends /publications/export/biocjson

# benchmark models. price is per 1M tokens (input / output) in USD.
# id is the short label used everywhere on disk; slug is the exact
# OpenRouter model string we POST.
#
# design (re-pinned 2026-09-01): 5 x 5. tier "frontier" = the five
# best available models; tier "budget" = the five latest cheap-but-
# good models. four provider-matched pairs (anthropic, google,
# openai, xai) keep the frontier-vs-budget comparison controlled on
# provider identity, plus ONE open-weight slot per tier (moonshotai
# kimi-k3 / z-ai glm-5.3-flash) so open models are represented in
# both tiers. all slugs and prices verified against the live
# OpenRouter catalog 2026-09-01; every model allows >= 32k output
# tokens. note: openai gpt-5.x / gpt-6 models ignore `temperature`
# (fixed by provider; OpenRouter drops the param silently) — covered by
# the "temperature=0 where the provider supports it" methods wording.
#
# refreshed 2026-09-28 at the user's direction to the newest slug per
# slot: opus-5 -> opus-5.5 ($5/$25 -> $4/$20), gpt-5.6-sol -> gpt-6-sol,
# grok-4.6 -> grok-4.7, gemini-3.7-flash -> gemini-3.8-flash,
# gpt-5.6-luna -> gpt-6-luna ($0.20/$1.20 -> $0.10/$0.50); glm-5.3-flash
# repriced upstream $0.07/$0.25 -> $0.15/$0.50. slugs, prices, context
# and max output verified against /api/v1/models on 2026-09-28.
#
# re-checked 2026-09-29 against /api/v1/models, keeping 5 + 5 with the
# newest model per slot: gpt-6-sol -> gpt-6.1-sol (released that day,
# same price); grok-4.7 repriced upstream $1.60/$4.80 -> $2.00/$6.00.
# no newer model exists in the other eight slots: gemini-3.1-pro-preview
# is still Google's newest Pro, haiku-4.5 Anthropic's newest Haiku, and
# glm-5.3-flashx / glm-5.3-prime are faster serving variants of the same
# GLM models, not newer ones.
#
# same day, at the user's direction: the OpenAI frontier slot takes the
# flagship, gpt-6.1-sol -> gpt-6-astra ($2/$10 -> $10/$50). m1 (opus-5.5)
# and m3 (gpt-6-astra) are the expensive arm of RQ1, m8 (gpt-6-luna) the
# cheap one. freeze this list on the day of the benchmark run and record
# that date.
# the 60 pilot stories ran on gemini-3.7-flash, so pilot and benchmark
# numbers for m7 are not the same model.
#   dev — free model for opportunistic zero-cost tests. NOT part of
#     the benchmark grid (the runner skips tier=dev unless named
#     explicitly, --model m0). measured ~550 s per run: not the pilot
#     default (that is m7, see runner.PILOT_MODEL_ID).
models:
  - { id: m1,  tier: frontier, slug: "anthropic/claude-opus-5.5",              provider: anthropic, price_in: 4.00,  price_out: 20.00 }
  - { id: m2,  tier: frontier, slug: "google/gemini-3.1-pro-preview",          provider: google,    price_in: 2.00,  price_out: 12.00 }
  - { id: m3,  tier: frontier, slug: "openai/gpt-6-astra",                     provider: openai,    price_in: 10.00, price_out: 50.00 }
  - { id: m4,  tier: frontier, slug: "x-ai/grok-4.7",                          provider: xai,       price_in: 2.00,  price_out: 6.00  }
  - { id: m5,  tier: frontier, slug: "moonshotai/kimi-k3",                     provider: moonshotai, price_in: 3.00,  price_out: 15.00 }
  - { id: m6,  tier: budget,   slug: "anthropic/claude-haiku-4.5",             provider: anthropic, price_in: 1.00,  price_out: 5.00  }
  - { id: m7,  tier: budget,   slug: "google/gemini-3.8-flash",                provider: google,    price_in: 0.75,  price_out: 3.75  }
  - { id: m8,  tier: budget,   slug: "openai/gpt-6-luna",                      provider: openai,    price_in: 0.10,  price_out: 0.50  }
  - { id: m9,  tier: budget,   slug: "x-ai/grok-4.3",                          provider: xai,       price_in: 1.25,  price_out: 2.50  }
  - { id: m10, tier: budget,   slug: "z-ai/glm-5.3-flash",                     provider: zai,       price_in: 0.15,  price_out: 0.50  }
  - { id: m0,  tier: dev,      slug: "nvidia/nemotron-3-ultra-550b-a55b:free", provider: nvidia,    price_in: 0.00,  price_out: 0.00  }

# LLM sampling parameters. shared across every stage of every model.
# temperature=0 where the provider supports it; max_tokens caps any
# single completion; request_timeout_s applies uniformly to OpenRouter
# AND to RENCI/Retriever calls so a hung backend can't deadlock the run.
generation:
  temperature: 0.0
  # max_tokens history: 4096 -> 8192 (2026-08-31, gemini-3.7-flash hit
  # the cap mid-JSON at answer_pick in 2/20 pilot runs) -> 16384
  # (2026-09-01, the 13-slug smoke: ling-3.0-flash emitted 9,841 output
  # tokens at answer_pick — reasoning tokens count toward the cap on
  # every roster model). every roster model allows >= 32,768 output
  # tokens (OpenRouter max_completion_tokens, verified 2026-09-01), so
  # 16384 is a uniform cap no model can exceed by design.
  max_tokens: 16384
  request_timeout_s: 120

# response reduction (stage 11 pre-step): every lookup response is
# ranked by evidence strength and flattened to a table before the
# LLM sees it. top_k_edges caps the rows; the full response stays on
# disk (reasoner_response.json) for the graph view and PubTator.
reduction:
  top_k_edges: 300

# ARAX (the default reasoner; runner --reasoner arax): Stage 10 sends
# the query to ARAX, which reasons over Tier 0 ("what may treat X" is
# answered by inference, with evidence paths), so a reply takes tens of
# seconds and is judged here as a ranked answer list. the benchmark's
# comparison condition, --reasoner lookup, sends the same query to
# Retriever as a one-hop Tier 0 lookup and lets the LLM do the reasoning.
#   timeout_s: ARAX's inferred mode can run for minutes on a broad
#     disease; the shared request_timeout_s (120 s) is too short.
#   top_k_answers: how many of ARAX's ranked answers Stage 11 reads.
#   paths_per_answer: reasoning paths drawn and explained per answer.
arax:
  timeout_s: 600
  top_k_answers: 30
  paths_per_answer: 3

# Retriever (Tier 0) knobs. tiers is sent as parameters.tiers on every
# query. Stage 4 probes only the first probe_candidates NameRes
# candidates, in parallel, each with its own timeout: a probe of a hub
# entity (pain: 3945 results, 66 MB, 25 s on 2026-09-29) must not stall
# the question, and a probe that times out counts as "unknown", never
# as "no facts".
retriever:
  tiers: [0]
  probe_candidates: 3
  probe_timeout_s: 30

# public site: what the service allows when it runs on the open
# internet with no login. switched on by PLOVERAI_PUBLIC=1 in
# pipeline/.env on the server; on a laptop the service listens on
# 127.0.0.1 only and none of this applies. the limits protect ARAX
# (every question keeps it busy for 30-60 s), the server's disk (a run
# is 0.1-30 MB) and the OpenRouter balance, in that order. nginx drops
# floods before they reach Python (deploy/nginx.conf.template); these
# are the per-question rules behind it.
#   models: the only model ids the public site serves (m8 is about
#     $0.002 per question). the reasoner is always ARAX.
#   questions_per_ip_per_hour: sliding one-hour window per address.
#   questions_per_day: all visitors together, per UTC day. a cap on
#     ARAX load and disk growth more than on money.
#   concurrent_runs / concurrent_runs_per_ip: questions in flight at
#     once, over everyone and per address.
public:
  models: [m8]
  questions_per_ip_per_hour: 20
  questions_per_day: 300
  concurrent_runs: 3
  concurrent_runs_per_ip: 1

# where artifacts go on disk. paths below are pipeline-relative
# (resolved against pipeline/ at load time, see code/config.py).
# layout reasoning:
#   - input data lives under benchmark/ (the gold set is read-only).
#   - things produced BY running code (logs, outputs) live under
#     code/ alongside the .py files that produce them.
paths:
  # the curated gold set is a directory of per-question JSON files
  # (benchmark/golden_questions/evidence/q1.json … q19.json), each
  # self-contained with its query_graph, validation block, evidence,
  # and verified_answers. config exposes the directory; the loader
  # iterates and parses every q*.json in alphanumeric order.
  questions: "benchmark/golden_questions/evidence"
  # NCATS Translator Tests assets converted by code/translator_assets.py
  # (tr*.json, each question in a template and a paraphrase phrasing).
  # the held-out test set; read by the runner and scorer, not the UI.
  translator_questions: "benchmark/golden_questions/translator"
  # the example questions of the web UI (not part of the benchmark).
  examples: "examples.yaml"
  results:   "code/outputs"
  logs:      "code/logs"
